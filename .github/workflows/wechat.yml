name: Sync WeChat articles

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      feed_url:
        description: "Optional RSS/Atom URL for testing"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: content-updates
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install website dependencies
        run: python -m pip install -r requirements-site.txt

      - name: Discover new WeChat articles
        env:
          WECHAT_FEED_URL: ${{ inputs.feed_url || secrets.WECHAT_FEED_URL || vars.WECHAT_FEED_URL }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_SLUG_PREFIX: caom
        run: python scripts/discover_wechat.py

      - name: Import WeChat articles
        run: python scripts/sync_wechat.py

      - name: Commit updates
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "paper-radar-bot@users.noreply.github.com"
          git add site/wechat_sources.json site/content
          if git diff --cached --quiet; then
            echo "No new WeChat articles."
          else
            git commit -m "Update WeChat articles"
            git push
          fi
