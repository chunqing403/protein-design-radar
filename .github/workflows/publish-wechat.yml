name: Publish a WeChat article

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: "WeChat article URL"
        required: true
        type: string
      featured:
        description: "Feature this article on the homepage"
        required: true
        default: false
        type: boolean
      topics:
        description: "Optional comma-separated topics"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: content-updates
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install website dependencies
        run: python -m pip install -r requirements-site.txt

      - name: Register article
        env:
          ARTICLE_URL: ${{ inputs.article_url }}
          FEATURED: ${{ inputs.featured }}
          TOPICS: ${{ inputs.topics }}
        run: >-
          python scripts/discover_wechat.py
          --article-url "$ARTICLE_URL"
          --featured "$FEATURED"
          --topics "$TOPICS"

      - name: Import article
        run: python scripts/sync_wechat.py

      - name: Commit updates
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "paper-radar-bot@users.noreply.github.com"
          git add site/wechat_sources.json site/content
          if git diff --cached --quiet; then
            echo "Article already exists; nothing to commit."
          else
            git commit -m "Publish WeChat article"
            git push
          fi
