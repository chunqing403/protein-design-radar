name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "config/**"
      - "site/**"
      - "src/**"
      - "public/**"
      - "scripts/prepare_web_assets.mjs"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows:
      - Daily paper radar
      - Sync WeChat articles
      - Publish a WeChat article
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build website
        env:
          PUBLIC_VISITOR_NOTIFY_ENDPOINT: ${{ vars.VISITOR_NOTIFY_ENDPOINT }}
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
