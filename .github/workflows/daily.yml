name: Daily paper radar

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-updates
  cancel-in-progress: false

jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install website dependencies
        run: python -m pip install -r requirements-site.txt

      - name: Generate daily recommendations
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/daily_recommend.py

      - name: Collect protein design news
        run: python scripts/daily_news.py

      - name: Discover new WeChat articles
        env:
          WECHAT_FEED_URL: ${{ secrets.WECHAT_FEED_URL || vars.WECHAT_FEED_URL }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_SLUG_PREFIX: caom
        run: python scripts/discover_wechat.py

      - name: Sync WeChat articles
        run: python scripts/sync_wechat.py

      - name: Commit updates
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "paper-radar-bot@users.noreply.github.com"
          git add README.md outputs data site/content site/wechat_sources.json
          if git diff --cached --quiet; then
            echo "No updates to commit."
          else
            git commit -m "Update daily paper recommendations"
            git push
          fi
